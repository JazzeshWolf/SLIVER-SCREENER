name: Refresh MCX data

# Free "serverless backend": fetches MCX data during market hours, computes
# OI/IV/basis, and commits public/data/latest.json + history.jsonl.
on:
  schedule:
    # Every 10 min, ~09:00–23:30 IST (03:30–18:00 UTC), Mon–Fri.
    # Offset off the top of the hour (:03/:13/… not :00/:10/…): GitHub delays or
    # drops scheduled runs that land on :00 (platform-wide load spike), so this
    # offset meaningfully improves how often the auto-refresh actually fires.
    # NOTE: markets are closed weekends, so Sat/Sun the app intentionally shows
    # Friday's last data — that is not a fault.
    - cron: "3,13,23,33,43,53 3-18 * * 1-5"
  workflow_dispatch: {} # manual trigger for testing
  push:
    # Rebuild data on code changes (e.g. fetcher tweaks) — ignore data-only
    # commits to avoid a self-trigger loop.
    # NOTE: `schedule` only ever fires from the repo's DEFAULT branch, whatever
    # this list says — so `main` must be the default branch for the cron to run.
    # To refresh data on a feature branch during development, use the manual
    # `workflow_dispatch` trigger with that branch selected; it runs that
    # branch's builder with the same secrets and commits back to that branch.
    branches: ["main"]
    paths-ignore:
      - "public/data/**"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm # only the alert step installs anything

      - name: Build data snapshot
        env:
          # Upstox 1-year read-only "Analytics" token — real MCX SILVERM
          # price/OI/options/IV + silver history. Preferred MCX source.
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
          # Free market-data key (Twelve Data) — gold/USD-INR history.
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          # Optional enhancements — set as repo secrets if you use them.
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_ACCESS_TOKEN: ${{ secrets.KITE_ACCESS_TOKEN }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: node scripts/build-data.mjs

      - name: Commit if changed
        run: |
          git config user.name "sliver-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/data)" ]; then
            git add public/data
            git commit -m "data: refresh MCX snapshot [skip ci]"
            git push
          else
            echo "No data changes."
          fi

      # Telegram conviction alerts (scripts/alerts.mjs; see CLAUDE.md). CONV is
      # not in the snapshot — the Sell tab computes it — so the script recomputes
      # it through the tab's own TypeScript module (src/lib/sellView.ts), hence
      # npm ci + vite-node. It judges freshness itself (live chain this build,
      # lastLiveAt moved, captured in MCX hours, chain changed) and holds
      # otherwise. `main` only: a feature-branch dispatch must never
      # move the real alert state. Deliberately NOT continue-on-error: a broken
      # alert path should turn the run red, and a missing end-of-day heartbeat
      # is the second tripwire. The data is already committed by this point, so
      # a failure here cannot hold the screener back.
      - name: Conviction alerts
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_MIN_CONV_METALS: ${{ vars.ALERT_MIN_CONV_METALS }}
          ALERT_MIN_DTE_METALS: ${{ vars.ALERT_MIN_DTE_METALS }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — alerts skipped."
            exit 0
          fi
          npm ci --no-audit --no-fund
          scripts/alerts-state.sh pull
          npm run -s alerts
          scripts/alerts-state.sh push metals
